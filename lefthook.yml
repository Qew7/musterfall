pre-commit:
  parallel: true
  commands:
    rubocop:
      root: backend/
      glob: "*.{rb,rake}"
      run: >
        bash -c 'exist=(); for f in {staged_files}; do
          [ -f "$f" ] && exist+=("$f");
        done;
        ((${#exist[@]})) || exit 0;
        exec bin/rubocop --force-exclusion -- "${exist[@]}"'
    leftovers:
      root: backend/
      glob: "*.rb"
      run: bundle exec leftovers
    rule_layers:
      root: backend/
      glob: "*.rb"
      run: ruby test/support/rule_layer_lint.rb

pre-push:
  commands:
    minitest:
      root: backend/
      run: bin/rails test
